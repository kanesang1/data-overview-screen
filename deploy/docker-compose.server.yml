services:
  dashboard:
    image: nginx:1.27-alpine
    container_name: data-overview-dev
    ports:
      - "${WEB_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.${NGINX_ENV:-dev}.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
