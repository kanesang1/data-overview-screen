services:
  web-dev:
    build:
      context: .
      args:
        BUILD_MODE: development
        NGINX_CONFIG: nginx.dev.conf
    image: data-overview-screen:dev
    ports:
      - "${DEV_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/config/dashboard-labels.json:/usr/share/nginx/html/config/dashboard-labels.json:ro
    restart: unless-stopped
    profiles: ["dev"]

  web-test:
    build:
      context: .
      args:
        BUILD_MODE: test
        NGINX_CONFIG: nginx.test.conf
    image: data-overview-screen:test
    ports:
      - "${TEST_PORT:-8082}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/config/dashboard-labels.json:/usr/share/nginx/html/config/dashboard-labels.json:ro
    restart: unless-stopped
    profiles: ["test"]
