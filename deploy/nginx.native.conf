# Standalone configuration. Paths are relative to the delivery directory (-p).
worker_processes 1;
pid logs/native-nginx.pid;
error_log logs/native-error.log;
events { worker_connections 1024; }
http {
    include native.mime.types;
    default_type application/octet-stream;
    access_log logs/native-access.log;
    sendfile on;
    client_body_temp_path logs/client_temp;
    proxy_temp_path logs/proxy_temp;
    fastcgi_temp_path logs/fastcgi_temp;
    uwsgi_temp_path logs/uwsgi_temp;
    scgi_temp_path logs/scgi_temp;
    upstream dashboard_backend {
        server 127.0.0.1:8080 max_fails=1 fail_timeout=5s;
        # Optional backup: server YOUR_INTRANET_BACKEND:8080 backup;
    }
    server {
        listen 80;
        server_name _;
        root .;
        index index.html;
        location = /health { default_type text/plain; return 200 'ok'; }
        location /api/ {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
        location = / { try_files /index.html =404; }
        location = /index.html { add_header Cache-Control 'no-store'; }
        location = /config/dashboard-labels.json { add_header Cache-Control 'no-store'; }
        location /service-details/ {
            try_files $uri =404;
            add_header Cache-Control 'no-store';
        }
        location /assets/ { try_files $uri =404; expires 7d; }
        location / { return 404; }
    }
}
